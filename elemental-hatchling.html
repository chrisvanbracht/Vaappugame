<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elemental Hatchling — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void-deep:#0d0b18;
    --void-mid:#1c1730;
    --gold:#c9a24b;
    --gold-bright:#e8c877;
    --parchment-ink:#ece3cc;
    --water:#4fb3d9;
    --earth:#7fae5a;
    --fire:#e2703a;
    --hybrid:#b984d6;
    --panel-line: rgba(201,162,75,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2148 0%, transparent 60%),
      radial-gradient(ellipse at 10% 110%, #1a1330 0%, transparent 55%),
      linear-gradient(180deg,var(--void-deep),#0a0813 80%);
    color:var(--parchment-ink);
    font-family:'Nunito',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding:22px 12px 40px;
  }
  .stagewrap{
    width:min(940px, 96vw);
  }
  h1{
    font-family:'Cinzel Decorative', serif;
    text-align:center;
    font-size:clamp(22px,4vw,34px);
    margin:2px 0 2px;
    letter-spacing:1px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold) 60%, #8a6b2e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 18px rgba(201,162,75,0.25);
  }
  .subtitle{
    text-align:center; font-size:13px; letter-spacing:2.5px; text-transform:uppercase;
    color:#9d8fc4; margin-bottom:14px; font-weight:600;
  }
  .frame{
    position:relative;
    border-radius:14px;
    padding:10px;
    background:linear-gradient(180deg,#221c3a,#150f26);
    border:1px solid var(--panel-line);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px -20px rgba(0,0,0,0.8), inset 0 0 40px rgba(201,162,75,0.05);
  }
  .frame::before{
    content:"";
    position:absolute; inset:4px;
    border:1px solid rgba(201,162,75,0.18);
    border-radius:10px;
    pointer-events:none;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    border-radius:8px;
    background:#000;
    cursor:default;
  }
  .below{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:10px; font-size:12.5px; color:#b6a9de; gap:10px; flex-wrap:wrap;
  }
  .keys{
    display:flex; gap:6px; align-items:center;
  }
  kbd{
    background:#241d3d; border:1px solid var(--panel-line); border-bottom-width:2px;
    padding:2px 7px; border-radius:5px; font-family:'Nunito',sans-serif; font-weight:800; font-size:11px; color:var(--gold-bright);
  }
  button.reset{
    background:linear-gradient(180deg,#2a2247,#1a1530);
    border:1px solid var(--gold); color:var(--gold-bright);
    padding:6px 14px; border-radius:8px; font-family:'Cinzel',serif; font-weight:600;
    letter-spacing:0.5px; cursor:pointer; font-size:12px;
  }
  button.reset:hover{ background:#332a56; }
  .legend{ display:flex; gap:14px; font-size:11.5px; color:#a99bd0; }
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle;}
</style>
</head>
<body>
  <div class="stagewrap">
    <h1>Elemental Hatchling</h1>
    <div class="subtitle">a jump-quest bestiary prototype</div>
    <div class="frame">
      <canvas id="game" width="900" height="580"></canvas>
    </div>
    <div class="below">
      <div class="keys">
        <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
        <span><kbd>space</kbd> jump</span>
        <span><kbd>enter</kbd> use portal</span>
        <span><kbd>esc</kbd> leave trial</span>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--water)"></span>Aqua</span>
        <span><span class="dot" style="background:var(--earth)"></span>Terran</span>
        <span><span class="dot" style="background:var(--fire)"></span>Ember</span>
      </div>
      <button class="reset" id="resetBtn">Reset Prototype</button>
    </div>
  </div>

<script>
(function(){
"use strict";

// ---------------------------------------------------------------------------
// CONSTANTS
// ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;
const PLAY_H = 470;           // main play area height
const BAR_Y = PLAY_H;         // bottom bar starts here
const BAR_H = CH - PLAY_H;

const RISE_GRAVITY = 0.55;      // gravity while moving upward — keeps jump takeoff snappy
const FALL_GRAVITY = 0.34;      // gravity while falling — gentler, so descent feels smoother
const MAX_FALL_SPEED = 9.5;     // terminal velocity while falling (was an abrupt 16)
const MAX_MOVE_SPEED = 4.3;
const GROUND_ACCEL = 0.85;      // how fast horizontal speed builds up on ground
const AIR_ACCEL = 0.5;          // slightly less crisp control mid-air
const GROUND_FRICTION = 0.75;   // damping applied when no input, on ground
const AIR_FRICTION = 0.94;      // much less damping in air — momentum carries, feels floaty
const APEX_THRESHOLD = 2.2;     // |vy| below this = near the top of the arc
const APEX_GRAVITY_MULT = 0.28; // gravity is softened near the apex for a brief hang
const JUMP_V = -12.6;
const JUMP_BUFFER_FRAMES = 8;   // ~130ms window: a jump press just before landing still fires
const COYOTE_FRAMES = 8;        // ~130ms window: still jumpable just after walking off a ledge
const FLUTTER_V = -10.2;        // Juvenile+: mid-air flutter jump, slightly weaker than a ground jump
const GLIDE_MAX_FALL = 1.5;     // Adult: capped fall speed while holding Space in the air

const ELEMENTS = ['water','earth','fire'];
const ELEMENT_COLOR = { water:'#4fb3d9', earth:'#7fae5a', fire:'#e2703a', hybrid:'#b984d6', neutral:'#d9c68e' };
const ELEMENT_LABEL = { water:'Aqua', earth:'Terran', fire:'Ember' };
const ELEMENT_ITEM_NAME = { water:'Water Droplet', earth:'Earth Crystal', fire:'Fire Ember' };

const HATCH_AT = 1;     // total feeds needed to hatch
const EVOLVE1_AT = 4;   // -> juvenile
const EVOLVE2_AT = 8;   // -> adult (final form locked)

// ---------------------------------------------------------------------------
// UTIL
// ---------------------------------------------------------------------------
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function lerpColor(hexA,hexB,t){
  const a=hexToRgb(hexA), b=hexToRgb(hexB);
  const r=Math.round(a.r+(b.r-a.r)*t), g=Math.round(a.g+(b.g-a.g)*t), bl=Math.round(a.b+(b.b-a.b)*t);
  const toHex = n => clamp(n,0,255).toString(16).padStart(2,'0');
  return `#${toHex(r)}${toHex(g)}${toHex(bl)}`;
}
function hexToRgb(hex){
  hex=hex.replace('#','');
  return { r:parseInt(hex.substring(0,2),16), g:parseInt(hex.substring(2,4),16), b:parseInt(hex.substring(4,6),16) };
}

// ---------------------------------------------------------------------------
// TEXTURES — small procedural noise canvases turned into repeatable CanvasPatterns.
// Generated once and cached, so we get organic surfaces instead of flat vector fills
// without loading any external image assets.
// ---------------------------------------------------------------------------
const patternCache = {};
function noiseCanvas(base, speckles, size, density, seed){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const o = c.getContext('2d');
  o.fillStyle = base; o.fillRect(0,0,size,size);
  let s = seed; // simple deterministic PRNG so the texture doesn't re-roll every regeneration
  const rand = ()=>{ s = (s*9301+49297)%233280; return s/233280; };
  for(let i=0;i<density;i++){
    const x = rand()*size, y = rand()*size, r = 0.5+rand()*1.9;
    o.globalAlpha = 0.12+rand()*0.35;
    o.fillStyle = speckles[Math.floor(rand()*speckles.length)];
    o.beginPath(); o.arc(x,y,r,0,Math.PI*2); o.fill();
  }
  o.globalAlpha=1;
  return c;
}
function getPattern(key, base, speckles, size=48, density=110, seed=17){
  if(!patternCache[key]) patternCache[key] = ctx.createPattern(noiseCanvas(base,speckles,size,density,seed), 'repeat');
  return patternCache[key];
}
const grassPattern      = ()=>getPattern('grass','#3d6b2c',['#2c4f1f','#5f9a41','#274318'],48,100,11);
const earthStonePattern = ()=>getPattern('earthstone','#6b5a46',['#4a3d2e','#8a7458','#59493a'],48,120,23);
const icePattern        = ()=>getPattern('ice','#2f7a9a',['#bfe8f5','#1c5372','#4fb3d9'],48,90,37);
const emberRockPattern  = ()=>getPattern('emberrock','#3a2a24',['#7a3a20','#c9542a','#1c120e'],48,120,53);
const eggShellPattern   = ()=>getPattern('eggshell','#f1e6c8',['#d8c495','#e7d5ad','#c9b485'],40,70,71);
const clothPattern      = ()=>getPattern('cloth','#5a4aa8',['#4a3d90','#6e5cc0','#3e3480'],28,60,91);
function scalePattern(hex){
  const key = 'scale-'+hex;
  if(!patternCache[key]){
    const c=document.createElement('canvas'); c.width=24; c.height=24;
    const o=c.getContext('2d');
    o.fillStyle=hex; o.fillRect(0,0,24,24);
    const light = lerpColor(hex,'#ffffff',0.35), dark = lerpColor(hex,'#000000',0.25);
    for(const [cx,cy] of [[4,4],[16,4],[10,14],[22,14],[-2,14]]){
      o.fillStyle = dark; o.globalAlpha=0.3;
      o.beginPath(); o.arc(cx,cy,7,0,Math.PI*2); o.fill();
      o.fillStyle = light; o.globalAlpha=0.18;
      o.beginPath(); o.arc(cx-1.5,cy-1.5,4,0,Math.PI*2); o.fill();
    }
    o.globalAlpha=1;
    patternCache[key] = ctx.createPattern(c,'repeat');
  }
  return patternCache[key];
}

// ---------------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------------
const keys = {};
window.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter','Escape'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space' && !e.repeat) player.jumpBufferFrames = JUMP_BUFFER_FRAMES;
  if(e.code==='Enter') tryUsePortal();
  if(e.code==='Escape') abandonLevel();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

// ---------------------------------------------------------------------------
// TOASTS
// ---------------------------------------------------------------------------
const toasts = [];
function toast(text){ toasts.push({text, t:220, max:220}); }
function updateToasts(){ for(let i=toasts.length-1;i>=0;i--){ toasts[i].t--; if(toasts[i].t<=0) toasts.splice(i,1); } }
function drawToasts(){
  let y = 34;
  for(const tst of toasts){
    ctx.save();
    ctx.globalAlpha = clamp(Math.min(tst.t/40, (tst.max-tst.t)/12),0,1);
    ctx.font = "700 15px 'Cinzel', serif";
    ctx.textAlign='center';
    const w = ctx.measureText(tst.text).width + 34;
    ctx.fillStyle='rgba(15,11,26,0.82)';
    roundRect(CW/2-w/2, y-20, w, 32, 8);
    ctx.fill();
    ctx.strokeStyle='rgba(201,162,75,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#f0e2ab';
    ctx.fillText(tst.text, CW/2, y+2);
    ctx.restore();
    y += 38;
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------------------------------------------------------------------------
// PET / EGG SYSTEM
// ---------------------------------------------------------------------------
const pet = {
  stage: 0, // 0 egg, 1 baby, 2 juvenile, 3 adult
  counts: { water:0, earth:0, fire:0 },
  total: 0,
  primary: null,
  formName: null,
  dominant(){
    let best=null, bestN=-1;
    for(const e of ELEMENTS){ if(this.counts[e]>bestN){ bestN=this.counts[e]; best=e; } }
    return bestN>0 ? best : this.primary;
  },
  isPure(){
    const nonZero = ELEMENTS.filter(e=>this.counts[e]>0);
    if(nonZero.length<=1) return true;
    const dom = this.dominant();
    return this.counts[dom] >= this.total*0.7;
  },
  colorNow(){
    if(this.stage===0) return '#e7dcb8';
    const dom = this.dominant();
    if(!dom) return ELEMENT_COLOR.neutral;
    if(this.isPure()) return ELEMENT_COLOR[dom];
    // blend top two
    const sorted = ELEMENTS.slice().sort((a,b)=>this.counts[b]-this.counts[a]);
    return lerpColor(ELEMENT_COLOR[sorted[0]], ELEMENT_COLOR[sorted[1]], 0.4);
  },
  // pale pastel skin tone for the body itself — dots & flower carry the strong element color
  bodyColor(){
    if(this.stage===0) return '#f1e6c8';
    const dom = this.dominant();
    if(!dom) return '#ece3d6';
    if(this.isPure()) return lerpColor('#ffffff', ELEMENT_COLOR[dom], 0.16);
    const sorted = ELEMENTS.slice().sort((a,b)=>this.counts[b]-this.counts[a]);
    const t1 = lerpColor('#ffffff', ELEMENT_COLOR[sorted[0]], 0.16);
    const t2 = lerpColor('#ffffff', ELEMENT_COLOR[sorted[1]], 0.16);
    return lerpColor(t1, t2, 0.35);
  }
};

function finalizeForm(){
  const dom = pet.dominant();
  if(pet.isPure()){
    const names = { water:'Aqua Vaappu', earth:'Terran Vaappu', fire:'Ember Vaappu' };
    pet.formName = names[dom];
  } else {
    pet.formName = 'Hybrid Vaappu';
  }
}

function feedPet(elem){
  pet.counts[elem]++;
  pet.total++;
  if(pet.stage===0){
    pet.stage=1;
    pet.primary=elem;
    toast(`The egg cracks open — an ${ELEMENT_LABEL[elem]} Vaappu wobbles out!`);
  } else if(pet.stage===1 && pet.total>=EVOLVE1_AT){
    pet.stage=2;
    toast('Evolved into a Juvenile — it can now flutter-jump once in mid-air!');
  } else if(pet.stage===2 && pet.total>=EVOLVE2_AT){
    pet.stage=3;
    finalizeForm();
    toast(`Final form reached: ${pet.formName}! It can now glide — hold Space in the air.`);
  } else {
    toast('Your pet enjoys the snack.');
  }
  spawnSparkles(EGG_X, EGG_Y, ELEMENT_COLOR[elem]);
}

// sparkle particles for feeding feedback
const sparkles = [];
function spawnSparkles(x,y,color){
  for(let i=0;i<14;i++){
    sparkles.push({
      x, y, color,
      vx:(Math.random()-0.5)*3.2,
      vy:-Math.random()*3.2-0.5,
      life: 40+Math.random()*20, max:60
    });
  }
}
function updateSparkles(){
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.07; s.life--;
    if(s.life<=0) sparkles.splice(i,1);
  }
}
function drawSparkles(){
  for(const s of sparkles){
    ctx.globalAlpha = clamp(s.life/s.max,0,1);
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,2.4,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ---------------------------------------------------------------------------
// PLAYER
// ---------------------------------------------------------------------------
const player = {
  x:420, y:340, w:26, h:38, vx:0, vy:0, grounded:false, facing:1,
  lastSafe:{x:420,y:340}, standingOn:null,
  coyoteFrames:0, jumpBufferFrames:0, airJumpsUsed:0, gliding:false
};

function maxAirJumps(){ return pet.stage>=2 ? 1 : 0; } // Juvenile+ can flutter-jump once in mid-air

function movePlayer(platforms){
  // horizontal input — accelerate toward a target speed and coast on release, instead of snapping
  let inputDir = 0;
  if(keys['ArrowLeft']){ inputDir=-1; player.facing=-1; }
  if(keys['ArrowRight']){ inputDir=1; player.facing=1; }
  const accel = player.grounded ? GROUND_ACCEL : AIR_ACCEL;
  const friction = player.grounded ? GROUND_FRICTION : AIR_FRICTION;
  if(inputDir!==0){
    player.vx = clamp(player.vx + inputDir*accel, -MAX_MOVE_SPEED, MAX_MOVE_SPEED);
  } else {
    player.vx *= friction;
    if(Math.abs(player.vx)<0.05) player.vx = 0;
  }

  // jump timers: coyote time forgives leaving a ledge, jump buffer forgives an early press
  if(player.grounded){ player.coyoteFrames = COYOTE_FRAMES; player.airJumpsUsed = 0; }
  else if(player.coyoteFrames>0){ player.coyoteFrames--; }
  if(player.jumpBufferFrames>0) player.jumpBufferFrames--;

  player.gliding = false;

  if(player.jumpBufferFrames>0){
    if(player.coyoteFrames>0){
      // normal ground jump (still allowed briefly after walking off a ledge)
      player.vy = JUMP_V;
      player.grounded = false;
      player.standingOn = null;
      player.coyoteFrames = 0;
      player.jumpBufferFrames = 0;
    } else if(player.airJumpsUsed < maxAirJumps()){
      // growth-linked mid-air flutter jump (Juvenile and Adult)
      player.vy = FLUTTER_V;
      player.airJumpsUsed++;
      player.jumpBufferFrames = 0;
      spawnSparkles(player.x+player.w/2, player.y+player.h/2, pet.colorNow());
    }
  }

  // gravity: soft hang near the apex, snappy rise, drag-eased fall — reads as "feathery" rather than a rigid parabola
  if(Math.abs(player.vy) < APEX_THRESHOLD){
    player.vy += (player.vy < 0 ? RISE_GRAVITY : FALL_GRAVITY) * APEX_GRAVITY_MULT;
  } else if(player.vy < 0){
    player.vy += RISE_GRAVITY;
  } else {
    // drag model: acceleration eases off the closer vy gets to terminal velocity, instead of a hard clamp
    player.vy += FALL_GRAVITY * (1 - player.vy/MAX_FALL_SPEED);
  }
  player.vy = clamp(player.vy, JUMP_V, MAX_FALL_SPEED);

  // Adult glide: holding Space while falling caps descent speed
  if(pet.stage>=3 && !player.grounded && keys['Space'] && player.vy>0){
    player.vy = Math.min(player.vy, GLIDE_MAX_FALL);
    player.gliding = true;
  }

  // carry along moving platform
  if(player.grounded && player.standingOn && player.standingOn.dx!==undefined){
    player.x += player.standingOn.dx;
    player.y += player.standingOn.dy;
  }

  // horizontal move + collide
  player.x += player.vx;
  player.x = clamp(player.x, 0, worldWidth()-player.w);
  for(const pl of platforms){
    if(rectsOverlap(player,pl)){
      if(player.vx>0) player.x = pl.x - player.w;
      else if(player.vx<0) player.x = pl.x + pl.w;
    }
  }

  // vertical move + collide
  player.grounded = false;
  player.standingOn = null;
  player.y += player.vy;
  for(const pl of platforms){
    if(rectsOverlap(player,pl)){
      if(player.vy>0){
        player.y = pl.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.standingOn = pl;
        player.lastSafe = {x:player.x, y:player.y};
      } else if(player.vy<0){
        player.y = pl.y + pl.h;
        player.vy = 0;
      }
    }
  }

  if(player.y > PLAY_H + 40) respawnPlayer(); // fell off world
}

function respawnPlayer(){
  player.x = player.lastSafe.x;
  player.y = player.lastSafe.y;
  player.vx = 0; player.vy = 0;
  hazardFlash = 18;
  toast('Ouch! Back to safety.');
}
let hazardFlash = 0;

function worldWidth(){
  return state==='HUB' ? CW : LEVELS[currentLevel].width;
}

function drawPlayer(px,py){
  ctx.save();
  ctx.translate(px+player.w/2, py+player.h/2);
  ctx.scale(player.facing,1);
  if(player.gliding){
    ctx.fillStyle = hexToRgba(pet.colorNow(), 0.4);
    ctx.beginPath(); ctx.ellipse(-16,-2,18,7,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16,-2,18,7,0.4,0,Math.PI*2); ctx.fill();
  }
  // legs
  ctx.fillStyle = '#3a3160';
  ctx.fillRect(-9,10,7,10);
  ctx.fillRect(2,10,7,10);
  // body (cloak)
  ctx.fillStyle = '#5a4aa8';
  roundRect(-11,-8,22,20,6); ctx.fill();
  // head
  ctx.fillStyle = '#e9c9a0';
  ctx.beginPath(); ctx.arc(0,-16,8,0,Math.PI*2); ctx.fill();
  // hood point
  ctx.fillStyle = '#7a63c9';
  ctx.beginPath();
  ctx.moveTo(-8,-20); ctx.lineTo(0,-32); ctx.lineTo(8,-20);
  ctx.closePath(); ctx.fill();
  // eye
  ctx.fillStyle='#1c1730';
  ctx.beginPath(); ctx.arc(4,-16,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// PET RENDERING (stages + 2 idle anims)
// ---------------------------------------------------------------------------
const EGG_X = 450, EGG_Y = 358;

// Vaappu body proportions per stage (a rounded, sausage/pill shape — never a tied-off end)
const VAAPPU_BASE_W = 17, VAAPPU_BASE_H = 32;
// fixed scatter of body dots (relative to half-width/half-height) so they don't re-roll every frame
const VAAPPU_DOTS = [
  {x:-0.55,y:-0.55,r:0.30}, {x:0.55,y:-0.15,r:0.22}, {x:-0.10,y:0.10,r:0.16},
  {x:0.45,y:0.55,r:0.27},   {x:-0.55,y:0.70,r:0.19}, {x:0.10,y:-0.85,r:0.14},
  {x:-0.30,y:0.90,r:0.15}
];

// click-to-flip (Juvenile+ only)
const FLIP_DURATION = 650; // ms
let flipStartT = null;
function triggerFlip(){
  if(pet.stage>=2) flipStartT = performance.now();
}

function drawPet(t){
  const bob = Math.sin(t*0.0022)*4;                 // idle anim A: continuous bob
  const cyclePos = t % 4200;
  const wiggle = cyclePos < 650 ? Math.sin((cyclePos/650)*Math.PI)*0.16 : 0; // idle anim B: periodic wiggle
  const blinking = cyclePos>650 && cyclePos<820;      // secondary flourish tied to anim B window

  let flipProgress = 0;
  if(flipStartT!==null){
    const elapsed = t - flipStartT;
    if(elapsed>=FLIP_DURATION){ flipStartT=null; }
    else flipProgress = elapsed/FLIP_DURATION;
  }
  const flipActive = pet.stage>=2 && flipProgress>0;
  const flipLift = flipActive ? Math.sin(flipProgress*Math.PI)*16 : 0;
  const flipScaleX = flipActive ? Math.cos(flipProgress*Math.PI*2) : 1;

  ctx.save();
  ctx.translate(EGG_X, EGG_Y + bob - flipLift);
  ctx.rotate(wiggle); // idle anim B: gentle rotate flourish
  if(flipActive) ctx.scale(flipScaleX, 1); // spin around the vertical axis, like a coin flip

  const glowColor = pet.colorNow();

  if(pet.stage===0){
    drawEgg();
  } else {
    const scale = pet.stage===1?0.85:pet.stage===2?1.1:1.4;
    ctx.scale(scale,scale);
    drawVaappuBody(blinking);
  }
  ctx.restore();

  // pedestal glow (signature element)
  ctx.save();
  const glowR = 46 + Math.sin(t*0.003)*4;
  const grad = ctx.createRadialGradient(EGG_X,EGG_Y+18,4,EGG_X,EGG_Y+18,glowR);
  grad.addColorStop(0, hexToRgba(glowColor,0.35));
  grad.addColorStop(1, hexToRgba(glowColor,0));
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(EGG_X,EGG_Y+18,glowR,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function hexToRgba(hex,a){
  const c = hexToRgb(hex);
  return `rgba(${c.r},${c.g},${c.b},${a})`;
}

function drawEgg(){
  ctx.save();
  ctx.fillStyle = '#f1e6c8';
  ctx.beginPath();
  ctx.ellipse(0,0,20,26,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1.5; ctx.stroke();
  // speckles
  ctx.fillStyle = 'rgba(180,150,90,0.5)';
  for(const [dx,dy] of [[-6,-8],[7,-2],[-3,10],[5,14],[-9,4]]){
    ctx.beginPath(); ctx.arc(dx,dy,2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// traces the outline of a vertical pill/capsule — rounded top AND bottom, never a tied sausage-end
function vaappuCapsulePath(w,h){
  const r = w/2;
  const half = Math.max(0,(h-w)/2);
  ctx.beginPath();
  ctx.moveTo(-r,-half);
  ctx.arc(0,-half,r,Math.PI,0,false);
  ctx.lineTo(r,half);
  ctx.arc(0,half,r,0,Math.PI,false);
  ctx.closePath();
}

function drawVaappuBody(blinking){
  const stage = pet.stage;
  const dom = pet.dominant();
  const hybrid = !pet.isPure();
  const bodyCol = pet.bodyColor();
  const w = VAAPPU_BASE_W, h = VAAPPU_BASE_H;
  const halfW = w/2, halfH = h/2;
  const capsuleTop = -halfH; // y of the very top of the pill shape

  // legs (drawn first so they sit behind the body's bottom cap)
  if(stage>=3) drawVaappuLimbs(stage, halfW, halfH, true);

  // body
  vaappuCapsulePath(w,h);
  ctx.fillStyle = bodyCol;
  ctx.fill();
  ctx.strokeStyle = 'rgba(30,20,15,0.55)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // arms (in front of the body edge, behind the face)
  if(stage>=2) drawVaappuLimbs(stage, halfW, halfH, false);

  // dots
  const dotCount = stage===1?3:stage===2?5:VAAPPU_DOTS.length;
  const sorted = ELEMENTS.slice().sort((a,b)=>pet.counts[b]-pet.counts[a]);
  for(let i=0;i<dotCount;i++){
    const d = VAAPPU_DOTS[i];
    const col = hybrid ? ELEMENT_COLOR[ i%2===0 ? sorted[0] : sorted[1] ] : ELEMENT_COLOR[dom];
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(d.x*halfW, d.y*halfH, Math.max(1.6,d.r*halfW), 0, Math.PI*2);
    ctx.fill();
  }

  // face — simple dot eyes + a curved smile, per the Vaappu's classic content expression
  const eyeY = -halfH*0.55;
  ctx.fillStyle='#241a14';
  if(blinking){
    ctx.fillRect(-halfW*0.55,eyeY,halfW*0.4,1.8);
    ctx.fillRect(halfW*0.15,eyeY,halfW*0.4,1.8);
  } else {
    ctx.beginPath(); ctx.arc(-halfW*0.35,eyeY,1.9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(halfW*0.35,eyeY,1.9,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='#241a14'; ctx.lineWidth=1.6; ctx.lineCap='round';
  ctx.beginPath();
  ctx.arc(0, eyeY+halfH*0.24, halfW*0.32, 0.15*Math.PI, 0.85*Math.PI, false);
  ctx.stroke();
  // cheeks
  ctx.fillStyle='rgba(255,150,150,0.4)';
  ctx.beginPath(); ctx.arc(-halfW*0.75,eyeY+halfH*0.18,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(halfW*0.75,eyeY+halfH*0.18,2.2,0,Math.PI*2); ctx.fill();

  // hat (Adult only, element-flavored) then flower(s) on top of the head
  if(stage>=3) drawVaappuHat(dom, capsuleTop, halfW);
  drawVaappuFlower(halfW*0.4, capsuleTop, hybrid ? sorted[0] : dom, stage);
  if(hybrid && stage>=2) drawVaappuFlower(-halfW*0.55, capsuleTop+3, sorted[1], stage, 0.75);
}

function drawVaappuLimbs(stage, halfW, halfH, legsPass){
  ctx.strokeStyle = '#241a14';
  ctx.fillStyle = '#241a14';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  if(legsPass){
    // legs peek out from the bottom cap
    for(const side of [-1,1]){
      const hipX = side*halfW*0.4, hipY = halfH*0.75;
      const footX = side*halfW*0.6, footY = halfH+9;
      ctx.beginPath(); ctx.moveTo(hipX,hipY); ctx.lineTo(footX,footY); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(footX + side*2.5, footY, 4, 2.2, 0, 0, Math.PI*2); ctx.fill();
    }
  } else {
    // stick arms with small rounded hands, resting at the sides
    for(const side of [-1,1]){
      const shoulderX = side*halfW*0.92, shoulderY = -halfH*0.05;
      const handX = side*(halfW+9), handY = halfH*0.35;
      ctx.beginPath();
      ctx.moveTo(shoulderX,shoulderY);
      ctx.quadraticCurveTo(side*(halfW+6), halfH*0.1, handX, handY);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(handX,handY,3,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawVaappuHat(dom, capsuleTop, halfW){
  ctx.save();
  ctx.translate(-halfW*0.35, capsuleTop+2);
  if(dom==='fire'){
    // little flame-tuft crest
    ctx.fillStyle = '#e2703a';
    for(const [dx,mul] of [[-5,0.8],[0,1],[5,0.8]]){
      ctx.beginPath();
      ctx.moveTo(dx,2);
      ctx.quadraticCurveTo(dx-3*mul,-8*mul,dx,-14*mul);
      ctx.quadraticCurveTo(dx+3*mul,-8*mul,dx,2);
      ctx.fill();
    }
    ctx.fillStyle='rgba(255,214,140,0.85)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-1.5,-6,0,-9); ctx.quadraticCurveTo(1.5,-6,0,0); ctx.fill();
  } else if(dom==='earth'){
    // acorn cap
    ctx.fillStyle = '#7a5a37';
    ctx.beginPath(); ctx.ellipse(0,-2,9,6,0,Math.PI,0,true); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1;
    for(let i=-6;i<=6;i+=3){ ctx.beginPath(); ctx.moveTo(i,-2); ctx.lineTo(i,-6); ctx.stroke(); }
    ctx.fillStyle='#5a4126';
    ctx.beginPath(); ctx.arc(0,-8,2,0,Math.PI*2); ctx.fill();
  } else {
    // aqua: small sailor cap
    ctx.fillStyle = '#eef6fa';
    ctx.beginPath(); ctx.ellipse(0,0,11,3.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4fb3d9';
    ctx.beginPath(); ctx.moveTo(-7,-1); ctx.quadraticCurveTo(0,-13,7,-1); ctx.quadraticCurveTo(0,-5,-7,-1); ctx.fill();
    ctx.strokeStyle='#2f7a9a'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(0,0,11,3.2,0,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawVaappuFlower(cx, topY, elem, stage, scaleMul){
  const s = (stage===1?0.6:stage===2?0.85:1) * (scaleMul||1);
  const flowerY = topY - 16*s;
  ctx.save();
  // curved stem
  ctx.strokeStyle = '#4a3d2e'; ctx.lineWidth = 1.8; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0, topY+2);
  ctx.quadraticCurveTo(cx*1.4, topY - 8*s, cx, flowerY+4*s);
  ctx.stroke();

  ctx.translate(cx, flowerY);
  ctx.scale(s,s);
  const petalCol = ELEMENT_COLOR[elem];
  const centerCol = lerpColor(petalCol, '#2a1c12', 0.55);
  for(let i=0;i<5;i++){
    const ang = (i/5)*Math.PI*2;
    ctx.save();
    ctx.rotate(ang);
    ctx.fillStyle = petalCol;
    ctx.beginPath();
    ctx.ellipse(0,-6,3.6,5.6,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = centerCol;
  ctx.beginPath(); ctx.arc(0,0,3.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function resetLevelState(lvl){
  if(lvl.type==='jumpquest' && lvl.collectibles.length){
    for(const c of lvl.collectibles) c.collected=false;
    lvl.locked = true;
  }
  if(lvl.type==='pottery'){
    for(const p of lvl.pots) p.broken=false;
    lvl.allBrokenAt = null;
  }
  if(lvl.type==='garden'){
    for(const p of lvl.plots){ p.elem=null; p.plantedAt=null; p.waters=0; p.bloomed=false; }
  }
}

function updateMovingPlatforms(level, t){
  for(const pl of level.platforms){
    const prevX=pl.x, prevY=pl.y;
    if(pl.bob){
      pl.y = (pl._baseY===undefined ? (pl._baseY=pl.y) : pl._baseY) + Math.sin(t*pl.bob.speed)*pl.bob.amp;
    }
    if(pl.moving){
      if(pl.moving.axis==='x'){
        pl.x = pl.moving.base + Math.sin(t*pl.moving.speed)*pl.moving.amp;
      } else {
        pl.y = pl.moving.base + Math.sin(t*pl.moving.speed)*pl.moving.amp;
      }
    }
    pl.dx = pl.x-prevX; pl.dy = pl.y-prevY;
  }
}

function geyserActive(g,t){
  const local = (t+g.phase) % g.period;
  return local < g.onDur;
}

const inventory = { water:0, earth:0, fire:0 };

let nearPortal = null;

function tryUsePortal(){
  if(state==='HUB' && nearPortal){
    enterLevel(nearPortal.elem);
  }
}
function enterLevel(elem){
  state='LEVEL';
  currentLevel = elem;
  const lvl = LEVELS[elem];
  resetLevelState(lvl);
  player.x = lvl.start.x; player.y = lvl.start.y; player.vx=0; player.vy=0;
  player.lastSafe = {x:lvl.start.x, y:lvl.start.y};
  camX = 0;
}
function returnToHub(){
  state='HUB';
  player.x = EGG_X-90; player.y=300; player.vx=0; player.vy=0;
  player.lastSafe = {x:player.x,y:player.y};
}
function abandonLevel(){
  if(state==='LEVEL') returnToHub();
}
function awardItemAndReturnToHub(elem){
  inventory[elem]++;
  toast(`You found a ${ELEMENT_ITEM_NAME[elem]}!`);
  returnToHub();
}
function completeLevel(){
  const lvl = LEVELS[currentLevel];
  const rewardElem = lvl.elem==='random' ? randomElement() : lvl.elem;
  awardItemAndReturnToHub(rewardElem);
}

function getMouse(e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width/r.width, scaleY = canvas.height/r.height;
  const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx*scaleX, y: cy*scaleY };
}

function onPointerDown(e){
  if(state!=='HUB') return;
  const m = getMouse(e);
  for(const s of slotRects()){
    if(inventory[s.elem]>0 && m.x>=s.x && m.x<=s.x+s.w && m.y>=s.y && m.y<=s.y+s.h){
      dragging = { elem:s.elem, x:m.x, y:m.y };
      e.preventDefault();
      return;
    }
  }
  // tap/click directly on the pet (Juvenile+) makes it do a playful flip
  const dx = m.x-EGG_X, dy = m.y-(EGG_Y+18);
  if(Math.sqrt(dx*dx+dy*dy) < 48 && pet.stage>=2){
    triggerFlip();
    e.preventDefault();
  }
}
function onPointerMove(e){
  if(dragging){ const m=getMouse(e); dragging.x=m.x; dragging.y=m.y; e.preventDefault(); }
}
function onPointerUp(e){
  if(!dragging) return;
  const dx = dragging.x-EGG_X, dy = dragging.y-(EGG_Y+18);
  if(Math.sqrt(dx*dx+dy*dy) < 48){
    inventory[dragging.elem]--;
    feedPet(dragging.elem);
  }
  dragging = null;
}
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, {passive:false});
canvas.addEventListener('touchmove', onPointerMove, {passive:false});
canvas.addEventListener('touchend', onPointerUp);

document.getElementById('resetBtn').addEventListener('click', ()=>{
  pet.stage=0; pet.counts={water:0,earth:0,fire:0}; pet.total=0; pet.primary=null; pet.formName=null;
  inventory.water=0; inventory.earth=0; inventory.fire=0;
  state='HUB'; player.x=EGG_X-90; player.y=300; player.vx=0; player.vy=0; player.lastSafe={x:EGG_X-90,y:300};
  toast('Prototype reset.');
});

// ---------------------------------------------------------------------------
// RENDERING — HUB
// ---------------------------------------------------------------------------
const DAY_CYCLE_MS = 5*60*1000; // a full day/night cycle takes 5 real minutes

// sky keyframes at phase 0/0.25/0.5/0.75 (1.0 wraps back to 0 = night)
const SKY_KEYFRAMES = [
  { p:0.00, top:'#0a0818', bottom:'#1a1430', label:'night' },
  { p:0.25, top:'#2c2150', bottom:'#c97b5a', label:'dawn'  },
  { p:0.50, top:'#3f7cc4', bottom:'#bfe3f7', label:'day'   },
  { p:0.75, top:'#3a2152', bottom:'#e2703a', label:'dusk'  },
  { p:1.00, top:'#0a0818', bottom:'#1a1430', label:'night' }
];

function dayPhase(t){ return (t % DAY_CYCLE_MS) / DAY_CYCLE_MS; }

function skyColors(phase){
  phase = ((phase%1)+1)%1;
  let a=SKY_KEYFRAMES[0], b=SKY_KEYFRAMES[1];
  for(let i=0;i<SKY_KEYFRAMES.length-1;i++){
    if(phase>=SKY_KEYFRAMES[i].p && phase<=SKY_KEYFRAMES[i+1].p){ a=SKY_KEYFRAMES[i]; b=SKY_KEYFRAMES[i+1]; break; }
  }
  const t = clamp((phase-a.p)/(b.p-a.p),0,1);
  return { top:lerpColor(a.top,b.top,t), bottom:lerpColor(a.bottom,b.bottom,t) };
}

// how "daylight" it is right now: 1 at noon (phase 0.5), 0 at phase 0.25/0.75, clamped to 0 through the night
function daylightAmount(phase){
  return Math.max(0, Math.cos((phase-0.5)*Math.PI*2));
}

// shared rise/set arc used for both the sun (phase itself) and the moon (phase shifted by half a cycle)
function celestialArc(phase){
  phase = ((phase%1)+1)%1;
  const winStart=0.22, winEnd=0.78;
  if(phase<winStart || phase>winEnd) return null;
  const t = (phase-winStart)/(winEnd-winStart);
  return {
    x: 70 + t*(CW-140),
    y: 260 - Math.sin(t*Math.PI)*190,
    alpha: Math.min(1, t*10, (1-t)*10)
  };
}

function drawSunAndMoon(phase){
  const sunPos = celestialArc(phase);
  if(sunPos){
    ctx.save();
    ctx.globalAlpha = sunPos.alpha;
    const glow = ctx.createRadialGradient(sunPos.x,sunPos.y,4,sunPos.x,sunPos.y,60);
    glow.addColorStop(0,'rgba(255,214,140,0.55)'); glow.addColorStop(1,'rgba(255,214,140,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sunPos.x,sunPos.y,60,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,224,150,0.95)';
    ctx.beginPath(); ctx.arc(sunPos.x,sunPos.y,26,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  const moonPhase = (phase+0.5)%1;
  const moonPos = celestialArc(moonPhase);
  if(moonPos){
    ctx.save();
    ctx.globalAlpha = moonPos.alpha;
    const glow = ctx.createRadialGradient(moonPos.x,moonPos.y,4,moonPos.x,moonPos.y,44);
    glow.addColorStop(0,'rgba(220,215,255,0.35)'); glow.addColorStop(1,'rgba(220,215,255,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(moonPos.x,moonPos.y,44,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(232,228,250,0.9)';
    ctx.beginPath(); ctx.arc(moonPos.x,moonPos.y,22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(180,175,210,0.5)';
    ctx.beginPath(); ctx.arc(moonPos.x-7,moonPos.y-5,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(moonPos.x+6,moonPos.y+7,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawStars(t,alpha){
  if(alpha<=0.02) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  for(let i=0;i<60;i++){
    const sx = (i*137)%CW;
    const sy = (i*71)%(PLAY_H-120);
    const tw = 0.5+0.5*Math.sin(t*0.001+i);
    ctx.globalAlpha = alpha*(0.25+0.35*tw);
    ctx.fillStyle='#cfc7f0';
    ctx.fillRect(sx,sy,1.6,1.6);
  }
  ctx.restore();
}

function drawHub(t){
  const phase = dayPhase(t);
  const sky = skyColors(phase);
  const dayness = daylightAmount(phase);

  const g = ctx.createLinearGradient(0,0,0,PLAY_H);
  g.addColorStop(0,sky.top); g.addColorStop(1,sky.bottom);
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,PLAY_H);

  drawStars(t, 1-dayness);
  drawSunAndMoon(phase);

  // ground — textured courtyard stone, tinted to match the storybook palette
  ctx.fillStyle = earthStonePattern();
  ctx.fillRect(0,HUB_GROUND_Y,CW,PLAY_H-HUB_GROUND_Y);
  ctx.fillStyle = 'rgba(35,25,70,0.55)';
  ctx.fillRect(0,HUB_GROUND_Y,CW,PLAY_H-HUB_GROUND_Y);
  ctx.fillStyle='rgba(201,162,75,0.18)';
  ctx.fillRect(0,HUB_GROUND_Y,CW,4);

  // portals
  nearPortal = null;
  for(const p of PORTALS){
    drawPortal(p,t);
    const zone = portalTriggerZone(p);
    if(rectsOverlap(player,zone)) nearPortal = p;
  }

  // pedestal
  ctx.fillStyle='#3a3160';
  roundRect(EGG_X-34, EGG_Y+16, 68, 26, 6); ctx.fill();
  ctx.fillStyle='rgba(201,162,75,0.5)';
  roundRect(EGG_X-34, EGG_Y+16, 68, 5, 3); ctx.fill();

  drawPet(t);
  drawPlayer(player.x, player.y);

  // ambient color wash — ties the whole scene to the current time of day
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = sky.bottom;
  ctx.fillRect(0,0,CW,PLAY_H);
  ctx.restore();

  if(nearPortal){
    ctx.save();
    ctx.font="600 13px 'Cinzel', serif";
    ctx.textAlign='center';
    ctx.fillStyle='#f0e2ab';
    ctx.fillText(`Press ENTER — ${nearPortal.label}`, nearPortal.x+nearPortal.w/2, nearPortal.y-14);
    ctx.restore();
  }

  drawHubHUD();
  drawInventoryTray();
}

function drawPortal(p,t){
  const col = p.color || ELEMENT_COLOR[p.elem];
  const pulse = 0.5+0.5*Math.sin(t*0.0025 + p.x);
  ctx.save();
  ctx.fillStyle = hexToRgba(col, 0.18+0.12*pulse);
  roundRect(p.x, p.y, p.w, p.h, 40); ctx.fill();
  ctx.strokeStyle = hexToRgba(col, 0.9);
  ctx.lineWidth=4;
  roundRect(p.x+6, p.y+6, p.w-12, p.h-12, 34); ctx.stroke();
  ctx.fillStyle = hexToRgba(col,0.55+0.2*pulse);
  roundRect(p.x+16, p.y+16, p.w-32, p.h-32, 26); ctx.fill();
  ctx.font="700 12px 'Cinzel', serif";
  ctx.fillStyle='#efe4c2'; ctx.textAlign='center';
  ctx.fillText(p.label, p.x+p.w/2, p.y+p.h+18);
  ctx.restore();
}

function drawHubHUD(){
  ctx.save();
  ctx.font="700 15px 'Cinzel', serif";
  ctx.fillStyle='#f0e2ab'; ctx.textAlign='left';
  const stageNames=['Unhatched Egg','Baby Vaappu','Juvenile Vaappu','Adult'];
  let title = stageNames[pet.stage];
  if(pet.stage===3) title = pet.formName;
  else if(pet.stage>0) title = `${ELEMENT_LABEL[pet.primary]} ${title}`;
  ctx.fillText(title, 16, 26);

  // feed progress bar
  const target = pet.stage===0?HATCH_AT:pet.stage===1?EVOLVE1_AT:pet.stage===2?EVOLVE2_AT:EVOLVE2_AT;
  const prevTarget = pet.stage===0?0:pet.stage===1?HATCH_AT:pet.stage===2?EVOLVE1_AT:EVOLVE2_AT;
  const frac = pet.stage===3?1:clamp((pet.total-prevTarget)/(target-prevTarget),0,1);
  ctx.font="600 11px 'Nunito', sans-serif";
  ctx.fillStyle='#a99bd0';
  ctx.fillText(pet.stage===3?'Fully grown':`Feed progress: ${pet.total}/${target}`, 16, 42);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  roundRect(16,48,180,7,3); ctx.fill();
  ctx.fillStyle=pet.colorNow();
  roundRect(16,48,180*frac,7,3); ctx.fill();
  ctx.restore();
}

function drawInventoryTray(){
  ctx.save();
  ctx.fillStyle='#171029';
  ctx.fillRect(0,BAR_Y,CW,BAR_H);
  ctx.fillStyle='rgba(201,162,75,0.35)';
  ctx.fillRect(0,BAR_Y,CW,1.5);

  ctx.font="600 11px 'Nunito', sans-serif";
  ctx.fillStyle='#a99bd0'; ctx.textAlign='left';
  ctx.fillText('Drag an item onto the egg to feed it', 24, BAR_Y+16);

  for(const s of slotRects()){
    const has = inventory[s.elem]>0;
    ctx.fillStyle = has ? hexToRgba(ELEMENT_COLOR[s.elem],0.22) : 'rgba(255,255,255,0.05)';
    roundRect(s.x,s.y,s.w,s.h,10); ctx.fill();
    ctx.strokeStyle = has? ELEMENT_COLOR[s.elem] : 'rgba(255,255,255,0.15)';
    ctx.lineWidth=1.5;
    roundRect(s.x,s.y,s.w,s.h,10); ctx.stroke();
    drawItemIcon(s.elem, s.x+s.w/2, s.y+s.h/2-4, has?1:0.35);
    ctx.font="800 12px 'Nunito', sans-serif";
    ctx.fillStyle = has? '#f0e2ab':'#5c5480';
    ctx.textAlign='center';
    ctx.fillText('x'+inventory[s.elem], s.x+s.w/2, s.y+s.h-6);
  }

  if(dragging){
    drawItemIcon(dragging.elem, dragging.x, dragging.y, 1, 1.3);
  }
  ctx.restore();
}

function drawItemIcon(elem, cx, cy, alpha=1, scale=1){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx,cy); ctx.scale(scale,scale);
  const col = ELEMENT_COLOR[elem];
  if(elem==='water'){
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(0,-12); ctx.quadraticCurveTo(11,4,0,14); ctx.quadraticCurveTo(-11,4,0,-12);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(-3,3,2.5,0,Math.PI*2); ctx.fill();
  } else if(elem==='earth'){
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(0,-13); ctx.lineTo(10,-2); ctx.lineTo(6,13); ctx.lineTo(-6,13); ctx.lineTo(-10,-2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.stroke();
  } else {
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(0,-13);
    ctx.bezierCurveTo(10,-4,8,6,0,13);
    ctx.bezierCurveTo(-8,6,-10,-4,0,-13);
    ctx.fill();
    ctx.fillStyle='rgba(255,220,150,0.7)';
    ctx.beginPath();
    ctx.moveTo(0,-6);
    ctx.bezierCurveTo(5,-1,4,4,0,9);
    ctx.bezierCurveTo(-4,4,-5,-1,0,-6);
    ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// RENDERING — LEVEL
// ---------------------------------------------------------------------------
function drawLevel(t){
  const lvl = LEVELS[currentLevel];
  if(lvl.type==='pottery'){ drawPotteryLevel(lvl,t); return; }
  if(lvl.type==='garden'){ drawGardenLevel(lvl,t); return; }
  drawJumpQuestLevel(lvl,t);
}

function drawRubbishIcon(kind,cx,cy){
  ctx.save();
  ctx.translate(cx,cy);
  if(kind==='can'){
    ctx.fillStyle='#9aa0ab';
    roundRect(-6,-8,12,16,2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(-6,-2,12,2);
  } else if(kind==='bottle'){
    ctx.fillStyle='rgba(120,190,140,0.85)';
    ctx.beginPath();
    ctx.moveTo(-2,-9); ctx.lineTo(2,-9); ctx.lineTo(2,-5); ctx.lineTo(5,-1); ctx.lineTo(5,9);
    ctx.lineTo(-5,9); ctx.lineTo(-5,-1); ctx.lineTo(-2,-5); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle='rgba(210,205,190,0.9)';
    ctx.beginPath(); ctx.moveTo(-7,-6); ctx.lineTo(3,-8); ctx.lineTo(7,2); ctx.lineTo(-2,7); ctx.lineTo(-7,3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();
}

function drawJumpQuestLevel(lvl,t){
  updateMovingPlatforms(lvl,t);

  camX = clamp(player.x - CW/2, 0, lvl.width-CW);

  const g = ctx.createLinearGradient(0,0,0,PLAY_H);
  g.addColorStop(0,lvl.bg[0]); g.addColorStop(1,lvl.bg[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,PLAY_H);

  ctx.save();
  ctx.translate(-camX,0);

  // parallax decoration
  drawZoneDecor(lvl, t);

  // hazards (water/lava floors etc)
  for(const h of lvl.hazards){
    ctx.fillStyle = lvl.elem==='water' ? 'rgba(40,140,190,0.75)' : 'rgba(220,90,40,0.8)';
    ctx.fillRect(h.x,h.y,h.w,h.h);
  }

  // geysers
  const geyserRects = [];
  if(lvl.geysers){
    for(const gz of lvl.geysers){
      const active = geyserActive(gz,t);
      ctx.fillStyle = active ? 'rgba(255,140,50,0.95)' : 'rgba(255,140,50,0.25)';
      ctx.fillRect(gz.x, active? gz.y : gz.y+gz.h*0.6, gz.w, active? gz.h : gz.h*0.4);
      if(active) geyserRects.push(gz);
    }
  }

  // platforms
  for(const pl of lvl.platforms){
    drawPlatform(pl, lvl.elem);
  }

  // collectibles (Sorting Trial) — touch to pick up
  let remaining = 0;
  if(lvl.collectibles.length){
    for(const c of lvl.collectibles){
      if(c.collected){ continue; }
      remaining++;
      const bob = Math.sin(t*0.004 + c.x)*3;
      drawRubbishIcon(c.kind, c.x+c.w/2, c.y+c.h/2+bob);
    }
    lvl.locked = remaining>0;
  }

  // goal
  drawGoalMarker(lvl, t);

  // player
  movePlayer(lvl.platforms.concat(geyserRects.map(g=>({x:g.x,y:g.y,w:g.w,h:g.h}))));

  // collectible pickup
  if(lvl.collectibles.length){
    for(const c of lvl.collectibles){
      if(!c.collected && rectsOverlap(player,c)){
        c.collected = true;
        spawnSparkles(c.x+c.w/2, c.y+c.h/2, '#cfd4e0');
        const left = lvl.collectibles.filter(cc=>!cc.collected).length;
        toast(left>0 ? `Picked up a scrap. ${left} left.` : 'All scraps collected — the door creaks open!');
      }
    }
  }

  // hazard collision (non-solid overlap = damage)
  for(const h of lvl.hazards){
    if(rectsOverlap(player,h)) respawnPlayer();
  }
  for(const gz of lvl.geysers||[]){
    if(geyserActive(gz,t) && rectsOverlap(player,{x:gz.x,y:gz.y,w:gz.w,h:gz.h})) respawnPlayer();
  }
  if(!lvl.locked && rectsOverlap(player, lvl.goal)) completeLevel();

  drawPlayer(player.x, player.y);

  ctx.restore(); // end camera translate

  if(hazardFlash>0){
    ctx.fillStyle = `rgba(220,60,40,${hazardFlash/18*0.35})`;
    ctx.fillRect(0,0,CW,PLAY_H);
    hazardFlash--;
  }

  drawLevelHUD(lvl);
}

function drawPlatform(pl, elem){
  ctx.save();
  if(elem==='water'){
    ctx.fillStyle = icePattern();
    ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle = 'rgba(191,232,245,0.55)';
    ctx.fillRect(pl.x,pl.y,pl.w,Math.min(5,pl.h));
  } else if(elem==='earth'){
    ctx.fillStyle = earthStonePattern();
    ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle = grassPattern();
    ctx.fillRect(pl.x,pl.y,pl.w,Math.min(7,pl.h));
  } else if(elem==='fire'){
    ctx.fillStyle = emberRockPattern();
    ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle = 'rgba(226,112,58,0.35)';
    ctx.fillRect(pl.x,pl.y,pl.w,Math.min(5,pl.h));
  } else {
    // neutral scaffolding — used by non-elemental activity rooms (Sorting Trial)
    ctx.fillStyle = earthStonePattern();
    ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle = 'rgba(140,150,175,0.45)';
    ctx.fillRect(pl.x,pl.y,pl.w,Math.min(5,pl.h));
  }
  ctx.restore();
}

function drawGoalMarker(lvl,t){
  if(lvl.collectibles.length){
    drawGoalDoor(lvl,t);
    return;
  }
  const gx = lvl.goal.x+lvl.goal.w/2, gy = lvl.goal.y-30+Math.sin(t*0.003)*5;
  ctx.save();
  ctx.translate(gx,gy);
  const glow = ctx.createRadialGradient(0,0,2,0,0,26);
  glow.addColorStop(0,hexToRgba(ELEMENT_COLOR[lvl.elem],0.5));
  glow.addColorStop(1,hexToRgba(ELEMENT_COLOR[lvl.elem],0));
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
  drawItemIcon(lvl.elem,0,0,1,1.1);
  ctx.restore();
}

// a door that stays shut (and faint) until the level's condition is met, then glows and opens
function drawGoalDoor(lvl,t){
  const gx = lvl.goal.x+lvl.goal.w/2, gy = lvl.goal.y+lvl.goal.h;
  ctx.save();
  ctx.translate(gx,gy);
  if(lvl.locked){
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#8a93b0'; ctx.lineWidth=3;
    roundRect(-22,-58,44,58,20); ctx.stroke();
    ctx.fillStyle='#8a93b0';
    ctx.font="20px 'Cinzel', serif"; ctx.textAlign='center';
    ctx.fillText('?', 0, -22);
  } else {
    const pulse = 0.5+0.5*Math.sin(t*0.004);
    const glow = ctx.createRadialGradient(0,-28,4,0,-28,44);
    glow.addColorStop(0, hexToRgba(lvl.color,0.5+0.15*pulse));
    glow.addColorStop(1, hexToRgba(lvl.color,0));
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,-28,44,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = hexToRgba(lvl.color, 0.85);
    roundRect(-22,-58,44,58,20); ctx.fill();
    ctx.fillStyle = 'rgba(20,15,30,0.55)';
    roundRect(-14,-48,28,44,14); ctx.fill();
  }
  ctx.restore();
}

function drawZoneDecor(lvl,t){
  ctx.save();
  ctx.globalAlpha=0.5;
  for(let i=0;i<14;i++){
    const bx = (i*260) - (camX*0.3)%260;
    if(lvl.elem==='water'){
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc((i*300)%lvl.width, 60+((i*53)%180), 6+((i*7)%10), 0, Math.PI*2); ctx.fill();
    } else if(lvl.elem==='earth'){
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse((i*320)%lvl.width, PLAY_H-60, 70,26,0,0,Math.PI*2); ctx.fill();
    } else if(lvl.elem==='fire'){
      ctx.fillStyle='rgba(255,140,60,0.12)';
      const ex=(i*47+ (t*0.02))%lvl.width, ey= PLAY_H-30-((i*37+t*0.05)%200);
      ctx.beginPath(); ctx.arc(ex,ey,2.4,0,Math.PI*2); ctx.fill();
    } else {
      // neutral drifting dust motes for non-elemental activity rooms
      ctx.fillStyle='rgba(220,220,235,0.18)';
      const dx=(i*61)%lvl.width, dy=(i*43+t*0.01)%(PLAY_H-40);
      ctx.beginPath(); ctx.arc(dx,dy,1.8,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawLevelHUD(lvl){
  ctx.save();
  ctx.font="700 15px 'Cinzel', serif";
  ctx.fillStyle = lvl.color || '#d9c68e'; ctx.textAlign='left';
  ctx.fillText(lvl.title, 16, 26);
  ctx.font="600 11px 'Nunito', sans-serif";
  ctx.fillStyle='#e6ddf5';
  ctx.fillText(lvl.hint, 16, 42);
  let extraY = 58;
  if(lvl.collectibles && lvl.collectibles.length){
    const left = lvl.collectibles.filter(c=>!c.collected).length;
    ctx.fillStyle = lvl.color;
    ctx.fillText(left>0 ? `Scraps remaining: ${left}/${lvl.collectibles.length}` : 'Door unlocked — head for the exit!', 16, extraY);
    extraY += 16;
  }
  if(pet.stage>=2){
    const ability = pet.stage>=3 ? 'Space: jump  •  mid-air Space: flutter jump  •  hold Space while falling: glide' : 'Space: jump  •  mid-air Space: flutter jump';
    ctx.fillStyle = pet.colorNow();
    ctx.fillText(ability, 16, extraY);
  }
  ctx.restore();

  // bottom bar during level: quick inventory summary + hint
  ctx.save();
  ctx.fillStyle='#171029';
  ctx.fillRect(0,BAR_Y,CW,BAR_H);
  ctx.fillStyle='rgba(201,162,75,0.35)';
  ctx.fillRect(0,BAR_Y,CW,1.5);
  ctx.font="600 12px 'Nunito', sans-serif";
  ctx.fillStyle='#a99bd0'; ctx.textAlign='left';
  ctx.fillText(lvl.escHint || 'ESC to abandon the trial and return to the nursery.', 24, BAR_Y+34);
  let ix = 24;
  for(const e of ELEMENTS){
    drawItemIcon(e, ix+10, BAR_Y+62, inventory[e]>0?1:0.3, 0.6);
    ctx.fillStyle= inventory[e]>0?'#f0e2ab':'#5c5480';
    ctx.font="800 12px 'Nunito', sans-serif";
    ctx.fillText('x'+inventory[e], ix+26, BAR_Y+66);
    ix += 70;
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------------------------
function frame(t){
  ctx.clearRect(0,0,CW,CH);
  if(state==='HUB'){
    movePlayer([ {x:0,y:HUB_GROUND_Y,w:CW,h:30} ]); // simple full-width ground for hub
    drawHub(t);
  } else {
    drawLevel(t);
  }
  updateSparkles(); drawSparkles();
  updateToasts(); drawToasts();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
